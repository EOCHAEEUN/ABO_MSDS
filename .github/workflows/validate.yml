name: validate
on:
  pull_request:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pydantic
      - run: python scripts/validate_labels.py data/labels
      - run: python scripts/validate_labels.py eval/test
      - run: python scripts/check_splits.py
