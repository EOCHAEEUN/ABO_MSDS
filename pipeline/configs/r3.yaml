# 증강 결과(예시 · 정답)는 v1과 같고 system 메시지만 다르다. 학습 사전 검사가 JSONL의 system 문구 = v2_1인지 확인한다.
prompt: v2_1
train_jsonl: data/prompt_v2_1/train.jsonl
